name: Verificar projeto
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node site-planner/prepare.cjs
      - run: node site-planner/build-worker.cjs
      - run: node --check site-planner/dist/app.js
      - run: node site-planner/check-auth.mjs
      - run: node site-planner/check-accounts.mjs
      - run: node site-planner/check-school.mjs
